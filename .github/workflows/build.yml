name: Build APK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sS -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-29" "build-tools;29.0.3"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Set up JDK 8 (for build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Build APK
        run: bash build.sh
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          OUT_APK: ${{ github.workspace }}/Mozhi.apk

      - name: Rename with version
        run: |
          VER=$(grep '^versionName=' version.properties | cut -d= -f2)
          mv Mozhi.apk "Mozhi-v$VER.apk"
          ls -la Mozhi-v$VER.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Mozhi-v*.apk

      - name: Upload APK artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Mozhi-APK
          path: Mozhi-v*.apk
